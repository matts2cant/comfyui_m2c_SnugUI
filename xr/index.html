<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ComfyUI App Mode XR</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; font: 16px system-ui, sans-serif; color: #e8ecf2; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	#hint { position: fixed; left: 16px; top: 12px; color: #8c96a8; font-size: 14px; z-index: 10; }
	[hidden] { display: none !important; }
	/* Desktop View windows and the deck: toolbar, output row, output pop-up (desktop.js) */
	.desk { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
	.desk, .deck, .phone { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
	.win { position: absolute; pointer-events: auto; background: #0b0e13; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px #323a49, 0 8px 28px rgba(0, 0, 0, 0.5); }
	.bar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 12px; font-weight: 600; font-size: 14px; cursor: move; }
	.bar span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
	.bar svg { width: 18px; height: 18px; flex: none; }
	.bar button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: none; color: #8c96a8; cursor: pointer; }
	.bar button:hover { background: #303846; color: #e8ecf2; }
	.note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
	.grip { position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 55%, #8c96a8 55%, #8c96a8 62%, transparent 62%, transparent 72%, #8c96a8 72%, #8c96a8 79%, transparent 79%); }
	.deck { position: fixed; z-index: 6; display: flex; gap: 8px; pointer-events: none; } /* placed by desktop.js renderDeck */
	.deck canvas { pointer-events: auto; flex: none; }
	.deck .popup { position: absolute; }
	/* phones (desktop.js renderPhone): the panels around the image, placed inside the safe area read from the padding */
	.phone { position: fixed; inset: 0; z-index: 6; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
	.phone > * { position: absolute; pointer-events: auto; }
	.phone .strip { display: flex; overflow: auto hidden; scrollbar-width: none; }
	.phone .strip canvas { flex: none; margin-left: auto; touch-action: pan-x; }
	.phone .pad { background: #161a22; }
	@media (pointer: coarse) {
		.bar { height: 44px; }
		.grip { width: 40px; height: 40px; background-size: 22px 22px; background-position: right bottom; background-repeat: no-repeat; }
	}
</style>
<script type="importmap">{ "imports": { "three": "/appmode-xr/static/vendor/three.module.js" } }</script>
</head>
<body>
<div id="hint" hidden>VR view on the desktop: drag to look, wheel to scroll, click to press; drag / wheel on the image pans / zooms it, shift- or right-drag moves the 3D model. R recenters, H hides the panels, the toolbar's monitor button goes back to the Desktop View.</div>
<script type="module" src="/appmode-xr/static/js/main.js"></script>
</body>
</html>
